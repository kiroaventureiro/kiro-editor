name: Harden KIRO Library visibility handling

on:
  push:
    branches:
      - feat/editor-studio-foundation
    paths:
      - .github/workflows/library-admin-safety.yml

permissions:
  contents: write

jobs:
  harden-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-studio-foundation

      - name: Keep visibility bound to the storage bucket
        shell: python
        run: |
          from pathlib import Path

          cloud = Path('src/editor/libraryCloud.ts')
          text = cloud.read_text(encoding='utf-8')
          update_block = '''  patch: Partial<{\n    name: string;\n    category: LibraryAdminAsset["category"];\n    tier: LibraryAdminAsset["tier"];\n    visibility: LibraryVisibility;\n    status: LibraryStatus;\n    tags: string[];\n    collection: string;\n  }>,'''
          safe_update_block = '''  patch: Partial<{\n    name: string;\n    category: LibraryAdminAsset["category"];\n    tier: LibraryAdminAsset["tier"];\n    status: LibraryStatus;\n    tags: string[];\n    collection: string;\n  }>,'''
          text = text.replace(update_block, safe_update_block)
          cloud.write_text(text, encoding='utf-8')

          admin = Path('src/components/LibraryAdmin.tsx')
          text = admin.read_text(encoding='utf-8')
          text = text.replace(
              '''    patch: Partial<{\n      status: LibraryStatus;\n      visibility: LibraryVisibility;\n    }>,''',
              '''    patch: Partial<{\n      status: LibraryStatus;\n    }>,'''
          )
          toggle = '''                    <button\n                      disabled={loading}\n                      onClick={() =>\n                        void changeStatus(asset, {\n                          visibility:\n                            asset.visibility === "public" ? "internal" : "public",\n                        })\n                      }\n                    >\n                      {asset.visibility === "public" ? "Tornar interno" : "Tornar público"}\n                    </button>\n'''
          text = text.replace(toggle, '')
          if 'A visibilidade fica vinculada ao bucket escolhido no upload.' not in text:
              text = text.replace(
                  '''              <button className="primary" disabled={loading || !file}>\n                <CloudUpload size={16} />''',
                  '''              <small className="library-admin-visibility-note">\n                A visibilidade fica vinculada ao bucket escolhido no upload. Para mudar entre público e interno, arquive e envie novamente.\n              </small>\n\n              <button className="primary" disabled={loading || !file}>\n                <CloudUpload size={16} />'''
              )
          admin.write_text(text, encoding='utf-8')

          api = Path('api/library-admin.js')
          text = api.read_text(encoding='utf-8')
          visibility_patch = '''  if (body?.visibility !== undefined) {\n    if (!allowedVisibility.has(body.visibility))\n      throw Object.assign(new Error("Visibilidade inválida."), { status: 400 });\n    patch.visibility = body.visibility;\n  }\n'''
          text = text.replace(visibility_patch, '')
          api.write_text(text, encoding='utf-8')

          css = Path('src/styles/library-admin-v1.css')
          text = css.read_text(encoding='utf-8')
          if '.library-admin-visibility-note' not in text:
              text += '''\n.library-admin-visibility-note {\n  display: block;\n  color: rgba(244, 246, 251, 0.5);\n  font-size: 11px;\n  line-height: 1.45;\n}\n'''
          css.write_text(text, encoding='utf-8')

      - name: Verify editor build
        run: |
          npm ci
          npm run build

      - name: Commit safety fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/libraryCloud.ts src/components/LibraryAdmin.tsx api/library-admin.js src/styles/library-admin-v1.css
          git diff --cached --quiet || git commit -m "fix: keep library visibility bound to storage"
          git push origin HEAD:feat/editor-studio-foundation
