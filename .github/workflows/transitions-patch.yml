name: Apply transition system patch

on:
  push:
    branches:
      - feat/editor-studio-foundation
    paths:
      - .github/workflows/transitions-patch.yml

permissions:
  contents: write

jobs:
  patch-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-studio-foundation
      - name: Patch transitions
        shell: python
        run: |
          from pathlib import Path

          # --- types ---
          path = Path('src/editor/types.ts')
          text = path.read_text(encoding='utf-8')
          if 'export type TransitionType' not in text:
              text = text.replace(
                  'export type TrackType = "video" | "audio" | "text" | "overlay";\n',
                  'export type TrackType = "video" | "audio" | "text" | "overlay";\nexport type TransitionType =\n  | "dissolve"\n  | "fade"\n  | "zoom"\n  | "slide-left"\n  | "slide-right";\n'
              )
          if 'transitionIn?: TransitionType;' not in text:
              text = text.replace(
                  '  backgroundPadding?: number;\n  notes?: string;',
                  '  backgroundPadding?: number;\n  transitionIn?: TransitionType;\n  transitionDuration?: number;\n  notes?: string;'
              )
          path.write_text(text, encoding='utf-8')

          # --- storage validation ---
          path = Path('src/editor/storage.ts')
          text = path.read_text(encoding='utf-8')
          if '"transitionDuration",' not in text:
              text = text.replace(
                  '        "backgroundPadding",\n      ] as const) {',
                  '        "backgroundPadding",\n        "transitionDuration",\n      ] as const) {'
              )
              # Fallback for current file where background fields are not in numeric list.
              text = text.replace(
                  '        "fontSize",\n      ] as const) {',
                  '        "fontSize",\n        "transitionDuration",\n      ] as const) {'
              )
          transition_guard = '''      if (\n        c.transitionIn !== undefined &&\n        !["dissolve", "fade", "zoom", "slide-left", "slide-right"].includes(\n          c.transitionIn,\n        )\n      )\n        throw new Error("Transição inválida.");\n'''
          marker = '      for (const key of ["text", "notes", "color"] as const)\n'
          if transition_guard not in text:
              text = text.replace(marker, transition_guard + marker)
          path.write_text(text, encoding='utf-8')

          # --- inspector controls ---
          path = Path('src/components/Inspector.tsx')
          text = path.read_text(encoding='utf-8')
          movement_anchor = '''      {clip.type !== "audio" && (\n        <section className="inspector-section">\n          <span className="section-kicker">MOVIMENTO</span>'''
          transition_block = '''      {clip.type !== "audio" && clip.type !== "text" && (\n        <section className="inspector-section transition-section">\n          <span className="section-kicker">TRANSIÇÃO DE ENTRADA</span>\n          <label>\n            Tipo\n            <select\n              aria-label="Transição de entrada"\n              value={clip.transitionIn ?? "none"}\n              onChange={(e) =>\n                onChange({\n                  transitionIn:\n                    e.target.value === "none"\n                      ? undefined\n                      : (e.target.value as Clip["transitionIn"]),\n                })\n              }\n            >\n              <option value="none">Sem transição</option>\n              <option value="dissolve">Dissolver</option>\n              <option value="fade">Fade</option>\n              <option value="zoom">Zoom</option>\n              <option value="slide-left">Deslizar da direita</option>\n              <option value="slide-right">Deslizar da esquerda</option>\n            </select>\n          </label>\n          {clip.transitionIn &&\n            range(\n              "Duração da transição",\n              "transitionDuration",\n              0.1,\n              Math.max(0.1, Math.min(3, clip.duration / 2)),\n              0.05,\n              Math.min(0.6, clip.duration / 2),\n            )}\n          <small>\n            A transição acontece no início do clipe e também é aplicada na exportação.\n          </small>\n        </section>\n      )}\n'''
          if 'TRANSIÇÃO DE ENTRADA' not in text:
              text = text.replace(movement_anchor, transition_block + movement_anchor)
          text = text.replace(
              '          Transições, filtros, desfoque, sombra e animações entrarão nesta aba.',
              '          Filtros, desfoque, sombra e animações avançadas entrarão nesta aba.'
          )
          path.write_text(text, encoding='utf-8')

          # --- render engine ---
          path = Path('src/editor/engine.ts')
          text = path.read_text(encoding='utf-8')
          old = '''        ctx.save();\n        ctx.globalAlpha = clamp(c.opacity ?? 1, 0, 1) * envelope(c, time);\n        ctx.translate(\n          w / 2 + (lerp(c.x ?? 0, c.endX) * w) / 100,\n          h / 2 + (lerp(c.y ?? 0, c.endY) * h) / 100,\n        );\n        ctx.rotate(((c.rotation ?? 0) * Math.PI) / 180);\n        const scale = lerp(c.scale ?? 1, c.endScale);\n        ctx.scale(scale, scale);'''
          new = '''        const transitionDuration = Math.max(\n          0.01,\n          Math.min(c.transitionDuration ?? 0.6, c.duration / 2),\n        );\n        const transitionProgress = c.transitionIn\n          ? clamp((time - c.start) / transitionDuration, 0, 1)\n          : 1;\n        const transitionSmooth =\n          transitionProgress *\n          transitionProgress *\n          (3 - 2 * transitionProgress);\n        let transitionAlpha = 1;\n        let transitionOffsetX = 0;\n        let transitionScale = 1;\n\n        if (c.transitionIn && transitionProgress < 1) {\n          if (c.transitionIn === "dissolve")\n            transitionAlpha = Math.sqrt(transitionSmooth);\n          else if (c.transitionIn === "fade")\n            transitionAlpha = transitionSmooth;\n          else if (c.transitionIn === "zoom") {\n            transitionAlpha = 0.35 + transitionSmooth * 0.65;\n            transitionScale = 0.72 + transitionSmooth * 0.28;\n          } else if (c.transitionIn === "slide-left") {\n            transitionAlpha = 0.5 + transitionSmooth * 0.5;\n            transitionOffsetX = (1 - transitionSmooth) * w * 0.42;\n          } else if (c.transitionIn === "slide-right") {\n            transitionAlpha = 0.5 + transitionSmooth * 0.5;\n            transitionOffsetX = -(1 - transitionSmooth) * w * 0.42;\n          }\n        }\n\n        ctx.save();\n        ctx.globalAlpha =\n          clamp(c.opacity ?? 1, 0, 1) *\n          envelope(c, time) *\n          transitionAlpha;\n        ctx.translate(\n          w / 2 +\n            (lerp(c.x ?? 0, c.endX) * w) / 100 +\n            transitionOffsetX,\n          h / 2 + (lerp(c.y ?? 0, c.endY) * h) / 100,\n        );\n        ctx.rotate(((c.rotation ?? 0) * Math.PI) / 180);\n        const scale = lerp(c.scale ?? 1, c.endScale) * transitionScale;\n        ctx.scale(scale, scale);'''
          if 'transitionProgress = c.transitionIn' not in text:
              if old not in text:
                  raise RuntimeError('Engine render anchor not found')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # --- timeline badge ---
          path = Path('src/components/Timeline.tsx')
          text = path.read_text(encoding='utf-8')
          badge_anchor = '                        <strong>{c.name}</strong>\n'
          badge = '''                        {c.transitionIn && (\n                          <span\n                            className="clip-transition-badge"\n                            title={`Transição: ${transitionLabel(c.transitionIn)} · ${(c.transitionDuration ?? 0.6).toFixed(2)} s`}\n                          >\n                            ◇\n                          </span>\n                        )}\n'''
          if 'clip-transition-badge' not in text:
              text = text.replace(badge_anchor, badge + badge_anchor)
          helper_anchor = '''function formatDuration(n: number) {\n'''
          helper = '''function transitionLabel(type: NonNullable<Clip["transitionIn"]>) {\n  if (type === "dissolve") return "Dissolver";\n  if (type === "fade") return "Fade";\n  if (type === "zoom") return "Zoom";\n  if (type === "slide-left") return "Deslizar da direita";\n  return "Deslizar da esquerda";\n}\n\n'''
          if 'function transitionLabel' not in text:
              text = text.replace(helper_anchor, helper + helper_anchor)
          path.write_text(text, encoding='utf-8')

          # --- transition styles ---
          css = Path('src/styles/transition-tools-v1.css')
          css.write_text('''.transition-section select {\n  width: 100%;\n}\n\n.clip-transition-badge {\n  position: absolute;\n  left: 3px;\n  top: 3px;\n  z-index: 5;\n  display: grid;\n  place-items: center;\n  width: 17px;\n  height: 17px;\n  border: 1px solid rgba(255, 255, 255, 0.5);\n  border-radius: 4px;\n  background: rgba(7, 14, 18, 0.82);\n  color: #c9ffe9;\n  font-size: 12px;\n  line-height: 1;\n  pointer-events: none;\n}\n\n.clip.selected .clip-transition-badge {\n  border-color: rgba(201, 255, 233, 0.9);\n  box-shadow: 0 0 10px rgba(130, 255, 205, 0.25);\n}\n''', encoding='utf-8')

          # --- main css import ---
          path = Path('src/main.tsx')
          text = path.read_text(encoding='utf-8')
          import_line = 'import "./styles/transition-tools-v1.css";\n'
          if import_line not in text:
              text = text.replace(
                  'import "./styles/caption-tools-v1.css";\n',
                  'import "./styles/caption-tools-v1.css";\n' + import_line
              )
          path.write_text(text, encoding='utf-8')

          # --- keep playhead independent of selection ---
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old_select = '''    if (!multiple) {\n      setTime(c.start);\n      setTimelineMode(c.type === "audio" ? "audio" : c.type === "text" ? "text" : "video");\n    }'''
          new_select = '''    if (!multiple) {\n      setTimelineMode(\n        c.type === "audio" ? "audio" : c.type === "text" ? "text" : "video",\n      );\n    }'''
          text = text.replace(old_select, new_select)
          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/types.ts src/editor/storage.ts src/components/Inspector.tsx src/editor/engine.ts src/components/Timeline.tsx src/styles/transition-tools-v1.css src/main.tsx src/App.tsx
          git diff --cached --quiet || git commit -m "feat: add timeline transitions"
          git push origin HEAD:feat/editor-studio-foundation
