name: Wire KIRO Library admin panel

on:
  push:
    branches:
      - feat/editor-studio-foundation
    paths:
      - .github/workflows/library-admin-wire.yml

permissions:
  contents: write

jobs:
  wire-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-studio-foundation

      - name: Wire admin route and styles
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          if 'import LibraryAdmin from "./components/LibraryAdmin";' not in text:
              text = text.replace(
                  'import MediaLibrary from "./components/MediaLibrary";\n',
                  'import MediaLibrary from "./components/MediaLibrary";\nimport LibraryAdmin from "./components/LibraryAdmin";\n'
              )

          state_anchor = '  const [timelineMode, setTimelineMode] = useState<TimelineMode>(undefined);\n'
          state_block = '''  const [timelineMode, setTimelineMode] = useState<TimelineMode>(undefined);\n  const [libraryAdminOpen, setLibraryAdminOpen] = useState(() => {\n    if (typeof window === "undefined") return false;\n    return new URLSearchParams(window.location.search).get("admin") === "library";\n  });\n'''
          if 'const [libraryAdminOpen, setLibraryAdminOpen]' not in text:
              if state_anchor not in text:
                  raise RuntimeError('Admin state anchor not found')
              text = text.replace(state_anchor, state_block)

          return_anchor = '  if (!loaded) return <div className="loading">Abrindo seu estúdio…</div>;\n'
          admin_return = '''  if (libraryAdminOpen)\n    return (\n      <LibraryAdmin\n        onClose={() => {\n          setLibraryAdminOpen(false);\n          const url = new URL(window.location.href);\n          url.searchParams.delete("admin");\n          window.history.replaceState({}, "", url);\n        }}\n      />\n    );\n  if (!loaded) return <div className="loading">Abrindo seu estúdio…</div>;\n'''
          if 'return (\n      <LibraryAdmin' not in text:
              if return_anchor not in text:
                  raise RuntimeError('App return anchor not found')
              text = text.replace(return_anchor, admin_return)
          app.write_text(text, encoding='utf-8')

          main = Path('src/main.tsx')
          text = main.read_text(encoding='utf-8')
          line = 'import "./styles/library-admin-v1.css";\n'
          if line not in text:
              text = text.replace(
                  'import "./styles/beat-markers-v1.css";\n',
                  'import "./styles/beat-markers-v1.css";\n' + line
              )
          main.write_text(text, encoding='utf-8')

      - name: Verify editor build
        run: |
          npm ci
          npm run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          git diff --cached --quiet || git commit -m "feat: expose secure KIRO Library admin route"
          git push origin HEAD:feat/editor-studio-foundation
